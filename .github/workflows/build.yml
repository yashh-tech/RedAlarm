name: Build RedAlarm APK

on:
  push:
    branches:
      - main
      - Latest_Update
      - yashh-tech-patch-2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Python regression tests
        shell: bash
        run: |
          python -m compileall -q main.py alarm_schedule.py alarm_sounds.py redalarm_timepicker.py splash_screen.py notification.py services java_src
          python -m unittest discover -s tests -v

      - name: Optimize packaged artwork without changing its layout
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from PIL import Image
          settings = {
              "redalarm_icon.png": (512, 512),
              "splashimage.png": (512, 512),
              "presplash2.png": (768, 1152),
          }
          for path, max_size in settings.items():
              with Image.open(path) as source:
                  mode = "RGBA" if "A" in source.getbands() else "RGB"
                  image = source.convert(mode)
                  image.thumbnail(max_size, Image.Resampling.LANCZOS)
                  image.save(path, format="PNG", optimize=True, compress_level=9)
                  print(f"Optimized {path}: {image.width}x{image.height}")
          PY

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.6.0

      - name: Show Build Environment
        shell: bash
        run: |
          python --version
          buildozer --version
          java -version
          echo "----- buildozer.spec -----"
          sed -n '1,220p' buildozer.spec

      - name: Clean Previous Build
        shell: bash
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        shell: bash
        env:
          P4A_PREREQUISITES_INSTALL_INTERACTIVE: "0"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RedAlarm-APK
          path: bin/*.apk
          if-no-files-found: error
